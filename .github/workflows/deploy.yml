# =============================================================================
# MergeWatch — Build, Test, Deploy Pipeline
# =============================================================================
#
# Pipeline:
#   push to main → build & test → deploy to dev → [30 min] → deploy to prod
#   (prod also deployable on-demand via workflow_dispatch with deploy_prod=true)
#
# The production gate is a 30-minute WAIT TIMER, not an approval requirement.
# Prod deploys on its own once the timer elapses; the window exists so a bad
# merge can be stopped by cancelling the run, not so someone has to click
# approve on every deploy.
#
# It used to be `required_reviewers`, and that failed in a specific way: a run
# parked at the gate holds the `deploy-pipeline` concurrency lock, so every
# later run queues behind it — including their DEV deploys. One run sat unapproved
# for ~9.5 hours and GitHub cancelled the next run outright (only one run may be
# pending per group). That very nearly shipped a merged-but-never-deployed
# change: nothing anywhere reports "this landed on main but not in prod".
#
# With a timer the lock is held 30 minutes at most, and every merge reaches prod.
#
# Concurrency is per-environment (`deploy-dev` / `deploy-prod`) rather than one
# group for the whole workflow, so a prod job waiting out its timer no longer
# blocks a later run's dev deploy. Neither group cancels in-flight runs: these
# are `sam deploy` calls, and killing one mid-flight can strand the stack in
# UPDATE_IN_PROGRESS.
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN           — IAM role ARN for OIDC (e.g. arn:aws:iam::123456789012:role/mergewatch-github-deploy)
#   AWS_REGION             — Target region (e.g. us-west-2)
#
# Optional GitHub Variables (Settings > Variables > Actions):
#   DEPLOYMENT_MODE        — 'saas' to enable billing, 'self-hosted' (default) to disable
#   DASHBOARD_BASE_URL     — Override dashboard URL (default: https://mergewatch.ai)
#
# Optional, for the E2E gate (#445) — DISABLED unless both are present:
#   vars.E2E_GATE_ENABLED  — set to 'true' to turn the gate on
#   secrets.FIXTURES_TOKEN — token with write access to mergewatch/fixtures.
#                            GITHUB_TOKEN does not reach another repository.
#
#   The gate BLOCKS prod on failure, so enable it only once the token exists
#   and the suite has a green baseline (#442, #443, #447). Emergency bypass:
#   workflow_dispatch with skip_e2e_gate=true.
#
# Required GitHub Environments:
#   development            — no protection rules needed
#   production             — "Wait timer" of 30 minutes, NO required reviewers.
#                            Adding required reviewers back reintroduces the
#                            parked-gate problem described above.
#
# Note: The Amplify web dashboard is managed via the AWS Console, not this pipeline.
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Deploy to production after dev?'
        required: false
        type: boolean
        default: false
      skip_e2e_gate:
        description: 'Skip the E2E gate (emergency prod deploy)?'
        required: false
        type: boolean
        default: false
      changed_paths:
        description: 'E2E gate self-test: space-separated paths to use instead of the commit diff'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write # Required for OIDC authentication

jobs:
  # =========================================================================
  # Stage 1: Build & Test
  # =========================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Verify Postgres migrations are up to date
        working-directory: packages/storage-postgres
        run: pnpm run migrations:check

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: SAM build (validate)
        working-directory: infra
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          sam build --parallel

  # =========================================================================
  # Stage 2: Deploy to Development
  # =========================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    environment: development
    # Serialized against other DEV deploys only. Previously dev and prod shared
    # one workflow-level group, so a prod job sitting in its gate blocked every
    # later run's dev deploy too — dev fell ~9.5 hours behind main for a reason
    # that had nothing to do with dev.
    #
    # cancel-in-progress stays false: these run `sam deploy`, and cancelling one
    # mid-flight can leave the CloudFormation stack in UPDATE_IN_PROGRESS, which
    # is worse than waiting.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM build
        working-directory: infra
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          sam build --parallel

      - name: SAM deploy to dev
        working-directory: infra
        env:
          DEPLOYMENT_MODE: ${{ vars.DEPLOYMENT_MODE }}
        run: |
          # Every stack parameter comes from infra/params/dev.env and is passed
          # on every deploy. CloudFormation silently retains any parameter a
          # deploy omits, which is how prod stayed pinned to a stale model (#264).
          STACK_PARAMS=$(grep -vE '^\s*(#|$)' params/dev.env | tr '\n' ' ')
          [ -n "$DEPLOYMENT_MODE" ] || { echo "::error::DEPLOYMENT_MODE repo variable is not set. Refusing to deploy rather than silently defaulting."; exit 1; }
          echo "Deploying dev with: Stage=dev DeploymentMode=$DEPLOYMENT_MODE $STACK_PARAMS"
          sam deploy \
            --stack-name mergewatch-dev \
            --region "$AWS_REGION" \
            --parameter-overrides "Stage=dev DeploymentMode=$DEPLOYMENT_MODE $STACK_PARAMS" \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --tags "Project=MergeWatch Environment=dev"

      - name: Verify deployed parameters match the repo
        working-directory: infra
        run: |
          # The failure mode #264 documented is silent: a parameter drifts and
          # nothing surfaces it until someone reads a Lambda's environment
          # months later. Assert the deployed value equals the declared one so
          # the drift can only ever be loud.
          EXPECTED=$(grep -E '^DefaultBedrockModelId=' params/dev.env | cut -d= -f2-)
          ACTUAL=$(aws lambda get-function-configuration \
            --function-name mergewatch-review-agent-dev \
            --region "$AWS_REGION" \
            --query 'Environment.Variables.DEFAULT_BEDROCK_MODEL_ID' \
            --output text)
          echo "declared: $EXPECTED"
          echo "deployed: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Deployed review model ($ACTUAL) does not match infra/params/dev.env ($EXPECTED)."
            exit 1
          fi
          echo "Review model matches the repo."

          # Matching the parameter is not the same as the model being usable.
          # A Bedrock model can be listed ACTIVE, have its agreement accepted,
          # and still reject InvokeModel for minutes afterwards — or forever, if
          # the account never accepted the agreement at all. Without this probe
          # the deploy goes green and every review 400s instead.
          #
          # The body deliberately mirrors what the provider sends: no sampling
          # parameters, because Opus 4.7+ and the 5 generation reject them
          # (see acceptsSamplingParams in packages/llm-bedrock).
          echo '{"anthropic_version":"bedrock-2023-05-31","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}' > /tmp/smoke.json
          if aws bedrock-runtime invoke-model \
               --model-id "$ACTUAL" \
               --region "$AWS_REGION" \
               --body fileb:///tmp/smoke.json \
               --cli-binary-format raw-in-base64-out \
               /tmp/smoke-out.json > /dev/null 2>/tmp/smoke-err.txt; then
            echo "Smoke invoke succeeded — $ACTUAL is reachable and accepts the request shape."
          else
            echo "::error::Deployed model $ACTUAL is configured but NOT invocable. Reviews would fail on every PR."
            # Print the whole error. A Bedrock refusal is a few lines, and
            # silently clipping it hides the one thing worth reading — an
            # AccessDeniedException reads very differently from a
            # ValidationException. Guarded with an if (not `[ ] && echo`, whose
            # non-zero exit would itself fail the step under bash -e).
            ERR_LINES=$(wc -l < /tmp/smoke-err.txt)
            if [ "$ERR_LINES" -gt 60 ]; then
              sed -n '1,60p' /tmp/smoke-err.txt
              echo "... ($((ERR_LINES - 60)) more lines suppressed)"
            else
              cat /tmp/smoke-err.txt
            fi
            exit 1
          fi

      - name: Print dev outputs
        if: success()
        run: |
          echo "## Development Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          WEBHOOK_URL=$(aws cloudformation describe-stacks \
            --stack-name mergewatch-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`WebhookUrl`].OutputValue' \
            --output text 2>/dev/null) || true
          if [ -n "$WEBHOOK_URL" ] && [ "$WEBHOOK_URL" != "None" ]; then
            echo "- **Webhook URL:** \`${WEBHOOK_URL}\`" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # Stage 3: E2E gate against dev (#445)
  # =========================================================================
  # Runs the fixture suite against the just-deployed DEV app and blocks prod on
  # the result. Before this, nothing verified dev before prod — the 30-minute
  # timer was a window for a human to notice and cancel, not a gate.
  #
  # Selection is impact-scoped (`--changed-files`), automated-only, and
  # graded-only:
  #   * --automated  — a MANUAL_ONLY fixture prints instructions instead of
  #                    failing, so a run nobody followed would read as a pass.
  #   * --graded     — grade-run.mjs exits non-zero only on FAIL/ERROR. A
  #                    fixture with no expect.json is UNGRADED and can never
  #                    fail, so running one costs a real PR and a real LLM
  #                    review to assert nothing (#447).
  #
  # DISABLED BY DEFAULT. Needs vars.E2E_GATE_ENABLED == 'true' plus a
  # FIXTURES_TOKEN secret with write access to mergewatch/fixtures — the
  # built-in GITHUB_TOKEN does not reach another repository. Because the gate
  # BLOCKS prod, enabling it before that secret exists would block every deploy.
  e2e-gate:
    name: E2E gate (dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: vars.E2E_GATE_ENABLED == 'true' && github.event.inputs.skip_e2e_gate != 'true'
    # Globally serialized, and not per-environment like the deploy jobs. The
    # suite opens real PRs in a SHARED repo and reset-env.sh closes every open
    # PR there — two concurrent gates would tear down each other's run.
    concurrency:
      group: e2e-fixtures
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.FIXTURES_TOKEN }}
      MW_STAGE: dev

    steps:
      - name: Checkout mergewatch.ai
        uses: actions/checkout@v6
        with:
          # Two commits so the merge diff is computable on workflow_dispatch,
          # where github.event.before is not set.
          fetch-depth: 2

      - name: Compute changed paths
        id: changed
        env:
          # Passed through the environment rather than interpolated into the
          # script: `${{ }}` of a user-supplied dispatch input lands inside the
          # shell as text, which is a command-injection hole.
          PATHS_OVERRIDE: ${{ github.event.inputs.changed_paths }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "${PATHS_OVERRIDE:-}" ]; then
            # The gate is otherwise only exercisable by pushing to main, which
            # means it cannot be tested without polluting the branch it guards.
            printf '%s\n' $PATHS_OVERRIDE | grep -v '^$' > /tmp/changed.txt
            echo "::warning::Using changed_paths override — this run is a gate self-test, not the real commit diff."
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$SHA" > /tmp/changed.txt
          else
            git diff --name-only HEAD~1 HEAD > /tmp/changed.txt
          fi
          echo "changed paths:"; cat /tmp/changed.txt

      - name: Checkout fixtures
        uses: actions/checkout@v6
        with:
          repository: mergewatch/fixtures
          token: ${{ secrets.FIXTURES_TOKEN }}
          path: fixtures-repo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Configure git identity for the fixture commits
        working-directory: fixtures-repo
        run: |
          # run-suite.sh commits each fixture overlay. A fresh runner has no
          # git identity, and `bootstrap.sh` does not set one — it assumes a
          # developer's local config. Without this the very first fixture dies
          # with "empty ident name" (exit 128) before opening any PR.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve the selection
        id: select
        working-directory: fixtures-repo
        run: |
          # `rc=$?` after a bare command is dead code here: the step shell is
          # `bash -e`, so a non-zero exit aborts before that line runs and the
          # diagnostic below never prints. The first real failure surfaced as a
          # naked "exit code 2" with the cause (`unknown argument: --graded`)
          # sitting unread in a file. Capture with `|| rc=$?` instead.
          set -uo pipefail
          rc=0
          EXPLAIN=1 scripts/select-fixtures.sh \
            --changed-files /tmp/changed.txt --automated --graded \
            > /tmp/sel.txt 2>/tmp/explain.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Fixture selection failed (rc=$rc). Selector output:"
            cat /tmp/explain.txt
            echo "::error::Exit 2 means an unknown tag, mode, or argument — usually the"
            echo "::error::fixtures repo lacking a filter this workflow expects."
            exit 1
          fi

          # An unmapped path resolves to the whole suite by design (#416's
          # pessimistic default). Cap it at the correctness set so worst-case
          # cost is one known number rather than the entire repo.
          CAPPED=no
          if grep -q 'unmapped path forces full suite' /tmp/explain.txt; then
            CAPPED=yes
            scripts/select-fixtures.sh --tag correctness --automated --graded > /tmp/sel.txt
            echo "Selection degraded to the full suite; capped to correctness+automated+graded."
            sed -n 's/^unmapped path forces full suite: /  unmapped: /p' /tmp/explain.txt
          fi

          COUNT=$(grep -c . /tmp/sel.txt || true)
          echo "capped=$CAPPED" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"
          echo "Selected $COUNT fixture(s)."; cat /tmp/sel.txt

      - name: Reset the fixtures environment
        if: steps.select.outputs.count != '0'
        working-directory: fixtures-repo
        run: |
          # A dirty fixtures repo produces failures that are not regressions,
          # which is the fastest way to make a blocking gate get ignored.
          scripts/reset-env.sh

      - name: Run the suite against dev
        if: steps.select.outputs.count != '0'
        working-directory: fixtures-repo
        env:
          # Reviews take 30-60s; without pacing every PR lands at once and the
          # review queue, not the product, decides the result.
          SLEEP: 45
        run: |
          xargs scripts/run-suite.sh < /tmp/sel.txt

      - name: Restore the tooling checkout
        if: steps.select.outputs.count != '0'
        working-directory: fixtures-repo
        run: |
          # Two things move the working tree away from the tooling:
          #
          #  1. run-suite leaves the repo on the LAST fixture branch, and
          #     fixture branches are cut from the e2e-baseline tag.
          #  2. reset-env.sh runs `git reset --hard e2e-baseline` ON MAIN, so
          #     the local main BRANCH POINTER is the baseline commit too.
          #
          # e2e-baseline predates the tooling: no grade-run.mjs, no
          # await-reviews.mjs, no select-fixtures.sh, and none of the 17
          # expect.json files. So `git checkout main` restores nothing — that
          # was the previous attempt at this step, and it failed identically.
          #
          # origin/main is the one ref reset-env does not touch.
          #
          # The invisible risk is worse than the 127: with the scripts present
          # but expect.json missing, every fixture grades UNGRADED, and
          # grade-run exits 0 on UNGRADED — a green gate that verified nothing.
          #
          # .e2e/ is gitignored, so the run manifest survives.
          git fetch --quiet origin main
          git checkout -f --detach origin/main
          echo "tooling at: $(git log -1 --oneline)"
          test -f scripts/grade-run.mjs    || { echo "::error::grade-run.mjs missing after restore"; exit 1; }
          test -f scripts/await-reviews.mjs || { echo "::error::await-reviews.mjs missing after restore"; exit 1; }
          n=$(ls fixtures/*/expect.json 2>/dev/null | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::no expect.json files — every fixture would grade UNGRADED and pass"; exit 1; }
          echo "restored $n expect.json file(s)"

      - name: Wait for every review to complete
        if: steps.select.outputs.count != '0'
        working-directory: fixtures-repo
        run: |
          # Was `sleep 120`. A timer cannot tell "the review is still working"
          # from "the review never started", and grading either one early
          # reports a missing comment as a product failure — so a dead-lettered
          # queue looked identical to a broken product in a gate that blocks
          # prod. This polls each PR's stage check run until it is completed,
          # and on timeout reports whether each PR is absent (webhook never
          # handled) or queued (accepted but stalled).
          scripts/await-reviews.mjs --stage "$MW_STAGE" --timeout 900

      - name: Grade
        id: grade
        if: steps.select.outputs.count != '0'
        working-directory: fixtures-repo
        run: |
          set -o pipefail
          scripts/grade-run.mjs --stage dev | tee /tmp/grade.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## E2E gate (dev)"
            echo ""
            echo "- Selected: **${{ steps.select.outputs.count }}** fixture(s)"
            echo "- Capped to correctness set: **${{ steps.select.outputs.capped }}**"
            if [ "${{ steps.select.outputs.count }}" = "0" ]; then
              echo ""
              echo "No fixture can observe these paths, so nothing ran. This is a pass, not a skip."
            fi
            if [ -f /tmp/grade.txt ]; then
              echo ""; echo '```'; tail -40 /tmp/grade.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        working-directory: fixtures-repo
        run: |
          # Always, including on failure: leaving ~10 open PRs behind would make
          # the next run's reset the thing that closes them, and a human opening
          # the repo would see a wall of red.
          scripts/reset-env.sh || echo "::warning::Teardown failed; fixtures repo may need a manual reset."

  # =========================================================================
  # Stage 4: Deploy to Production
  # =========================================================================
  # Runs after a successful dev deploy on every push to main, AND on a manual
  # workflow_dispatch with deploy_prod=true. It then waits out the "production"
  # environment's 30-minute timer (#428 replaced required reviewers with a
  # timer; see the header for why).
  #
  # It is additionally gated on the E2E suite passing against dev. A skipped
  # gate — disabled, or bypassed via skip_e2e_gate — still allows prod; a
  # FAILED gate does not.
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-dev, e2e-gate]
    # always() is required because e2e-gate is SKIPPED when disabled or
    # bypassed, and a skipped dependency would otherwise skip this job too.
    # Spelling out deploy-dev's result is the cost of that: `needs:` no longer
    # implies success once always() is in play.
    if: >-
      always()
      && needs.deploy-dev.result == 'success'
      && (needs.e2e-gate.result == 'success' || needs.e2e-gate.result == 'skipped')
      && (github.event_name == 'push' || github.event.inputs.deploy_prod == 'true')
    environment: production
    # Serialized against other PROD deploys only. A job waiting out the
    # environment's 30-minute timer holds this group, so back-to-back merges
    # still reach prod in order — but they no longer hold up anyone's dev
    # deploy. Same reason as above for not cancelling in-flight deploys.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM build
        working-directory: infra
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          sam build --parallel

      - name: SAM deploy to prod
        working-directory: infra
        env:
          DEPLOYMENT_MODE: ${{ vars.DEPLOYMENT_MODE }}
        run: |
          # See the dev step. Prod previously passed neither DefaultBedrockModelId
          # nor DashboardBaseUrl, so CloudFormation retained whatever the stack
          # already held — the root cause of #264.
          STACK_PARAMS=$(grep -vE '^\s*(#|$)' params/prod.env | tr '\n' ' ')
          [ -n "$DEPLOYMENT_MODE" ] || { echo "::error::DEPLOYMENT_MODE repo variable is not set. Refusing to deploy rather than silently defaulting."; exit 1; }
          echo "Deploying prod with: Stage=prod DeploymentMode=$DEPLOYMENT_MODE $STACK_PARAMS"
          sam deploy \
            --stack-name mergewatch \
            --region "$AWS_REGION" \
            --parameter-overrides "Stage=prod DeploymentMode=$DEPLOYMENT_MODE $STACK_PARAMS" \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --tags "Project=MergeWatch Environment=prod"

      - name: Verify deployed parameters match the repo
        working-directory: infra
        run: |
          # The failure mode #264 documented is silent: a parameter drifts and
          # nothing surfaces it until someone reads a Lambda's environment
          # months later. Assert the deployed value equals the declared one so
          # the drift can only ever be loud.
          EXPECTED=$(grep -E '^DefaultBedrockModelId=' params/prod.env | cut -d= -f2-)
          ACTUAL=$(aws lambda get-function-configuration \
            --function-name mergewatch-review-agent-prod \
            --region "$AWS_REGION" \
            --query 'Environment.Variables.DEFAULT_BEDROCK_MODEL_ID' \
            --output text)
          echo "declared: $EXPECTED"
          echo "deployed: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Deployed review model ($ACTUAL) does not match infra/params/prod.env ($EXPECTED)."
            exit 1
          fi
          echo "Review model matches the repo."

          # Matching the parameter is not the same as the model being usable.
          # A Bedrock model can be listed ACTIVE, have its agreement accepted,
          # and still reject InvokeModel for minutes afterwards — or forever, if
          # the account never accepted the agreement at all. Without this probe
          # the deploy goes green and every review 400s instead.
          #
          # The body deliberately mirrors what the provider sends: no sampling
          # parameters, because Opus 4.7+ and the 5 generation reject them
          # (see acceptsSamplingParams in packages/llm-bedrock).
          echo '{"anthropic_version":"bedrock-2023-05-31","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}' > /tmp/smoke.json
          if aws bedrock-runtime invoke-model \
               --model-id "$ACTUAL" \
               --region "$AWS_REGION" \
               --body fileb:///tmp/smoke.json \
               --cli-binary-format raw-in-base64-out \
               /tmp/smoke-out.json > /dev/null 2>/tmp/smoke-err.txt; then
            echo "Smoke invoke succeeded — $ACTUAL is reachable and accepts the request shape."
          else
            echo "::error::Deployed model $ACTUAL is configured but NOT invocable. Reviews would fail on every PR."
            # Print the whole error. A Bedrock refusal is a few lines, and
            # silently clipping it hides the one thing worth reading — an
            # AccessDeniedException reads very differently from a
            # ValidationException. Guarded with an if (not `[ ] && echo`, whose
            # non-zero exit would itself fail the step under bash -e).
            ERR_LINES=$(wc -l < /tmp/smoke-err.txt)
            if [ "$ERR_LINES" -gt 60 ]; then
              sed -n '1,60p' /tmp/smoke-err.txt
              echo "... ($((ERR_LINES - 60)) more lines suppressed)"
            else
              cat /tmp/smoke-err.txt
            fi
            exit 1
          fi

      - name: Print prod outputs
        if: success()
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          WEBHOOK_URL=$(aws cloudformation describe-stacks \
            --stack-name mergewatch \
            --query 'Stacks[0].Outputs[?OutputKey==`WebhookUrl`].OutputValue' \
            --output text 2>/dev/null) || true
          if [ -n "$WEBHOOK_URL" ] && [ "$WEBHOOK_URL" != "None" ]; then
            echo "- **Webhook URL:** \`${WEBHOOK_URL}\`" >> $GITHUB_STEP_SUMMARY
          fi
