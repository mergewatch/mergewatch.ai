# Release Gate (#505).
#
# Cuts a release ONLY after the graded fixture suite passes and a human has
# verified the manual set. Nothing reaches a `v*` tag without both — and since
# #513, nothing reaches GHCR without a tag either.
#
# That second half used to be asserted here and was false: docker-publish also
# fired on every qualifying push to main, so `latest` tracked main with no gate
# at all, while the gate's own release published nothing (GITHUB_TOKEN
# suppresses the `release: published` event). Images now ship only from the
# `release` job below, which dispatches docker-publish explicitly and waits.
#
# This replaces the previous ordering, where `fixtures/release-suite.yml`
# triggered ON `push: tags: v*`. That validated a release that already existed:
# if the suite failed, the tag and the published images were already out.
#
# Phases, and why they are separate jobs:
#
#   suite    runs and grades the automated set. Holds the `e2e-fixtures`
#            concurrency group, the SAME group the deploy gate uses, so a
#            release run and a merge's gate can never drive the shared fixtures
#            repo at once (#506). Tears down in always(), BEFORE any human waits.
#
#   verify   pauses for a person to work through the manual fixtures. Holds NO
#            lock — deliberately. A job parked on a human approval while holding
#            `e2e-fixtures` would queue every merge's gate behind it, which is
#            #428 exactly: one run sat ~9.5 hours and GitHub cancelled the next.
#            Manual fixtures need a human to APPLY and drive them (reply in a
#            thread, add a reaction, assert Dynamo/dashboard state), not to
#            inspect a PR left lying around — so nothing needs to stay open.
#
#   release  creates the annotated tag and the GitHub release. Only reachable
#            through an approved `verify`.
name: Release Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to cut, e.g. v1.4.0'
        required: true
        type: string
      candidate_ref:
        description: 'Commit or branch to release (default: main)'
        required: false
        default: 'main'
        type: string
      dry_run:
        description: 'Run and grade, then stop — no approval, no tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # `actions: write` is what lets the release job DISPATCH docker-publish.
  # Without it the dispatch fails 403 "Resource not accessible by integration"
  # and the release exists with no images — which is exactly what v0.6.1 did.
  # It is not covered by `contents: write`: dispatching a workflow is an Actions
  # API write, and GITHUB_TOKEN grants only what is declared here.
  actions: write

jobs:
  # ── prepare ────────────────────────────────────────────────────────────────
  # #549 — bump versions and the changelog BEFORE grading.
  #
  # The gate tags the exact SHA the suite graded and re-verifies that before
  # tagging. A version-bump commit changes the SHA, so the invariant has to be
  # preserved deliberately. Bumping first is the only ordering where the tree
  # that was TESTED and the tree that was TAGGED are byte-identical — the guard
  # below stays a plain equality check rather than becoming parentage
  # arithmetic, and the tag never points at a tree whose package.json is stale.
  #
  # That is not hypothetical: v0.6.0 shipped with every package.json still
  # reading 0.5.0, and there is no 0.6.0 changelog section, because #505
  # replaced the manual flow and never adopted scripts/release.sh.
  #
  # Accepted cost: if the suite then fails, `main` briefly carries a bump for a
  # release that did not happen. Visible, recoverable, and cheaper than tagging
  # a tree nobody graded.
  prepare:
    name: Prepare the release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          # release.sh requires main and a clean tree, and the commit has to
          # land on a branch rather than a detached HEAD.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump versions and the changelog
        id: commit
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.candidate_ref }}
        run: |
          # -e matters here. Without it a failed `git push` does NOT abort:
          # execution continues, SHA is captured from a local-only commit, the
          # output is written, and the step exits 0 because the last command
          # succeeded. The job would go GREEN having pushed nothing, and `suite`
          # would then try to grade a commit that exists on no remote.
          set -euo pipefail
          # Only `main` can be prepared: the bump commit is pushed there, and
          # pushing it while grading a different ref would tag a tree that was
          # never prepared.
          if [ "$REF" != "main" ]; then
            echo "::error::candidate_ref must be 'main' to prepare a release (got '$REF')"
            exit 1
          fi

          git config user.name  "mergewatch-release-gate"
          git config user.email "release-gate@mergewatch.ai"

          # --no-git: the script edits files, this job owns the commit. A
          # script that also tagged would create a second tag path with none
          # of the guards below.
          if ! scripts/release.sh "$VERSION" --no-git; then
            echo "::error::release.sh failed — nothing was committed"
            exit 1
          fi

          if git diff --quiet; then
            echo "::error::release.sh changed nothing — is $VERSION already the current version?"
            exit 1
          fi

          git add -A
          git commit -m "chore: release $VERSION"
          git push origin main

          SHA="$(git rev-parse HEAD)"
          # Belt and braces on top of `set -e`: confirm the commit is actually
          # on the remote before handing the SHA downstream. A push that
          # "succeeded" but landed elsewhere would otherwise be graded and
          # tagged as if it were on main.
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "::error::pushed $SHA but origin/main is $(git rev-parse origin/main) — refusing to continue"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "prepared $VERSION at $SHA"
          {
            echo "## Prepared"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$SHA\`"
            echo ""
            echo "The suite grades THIS commit, and the release tags it. Tested and tagged are the same tree."
          } >> "$GITHUB_STEP_SUMMARY"

  suite:
    name: Graded suite
    needs: prepare
    runs-on: ubuntu-latest
    # The same group the deploy gate uses. Different groups was #506: both
    # workflows drive one shared fixtures repo, and reset-env.sh closes every
    # open PR there, so an overlap tears down the other run's fixtures.
    concurrency:
      group: e2e-fixtures
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.FIXTURES_TOKEN }}
      MW_STAGE: dev
    outputs:
      graded: ${{ steps.grade.outputs.summary }}
      # The exact commit that was graded. Everything downstream pins to THIS,
      # never to the input ref: `candidate_ref` defaults to `main`, which is
      # mutable, and the approval window can be hours long. Re-resolving it
      # afterwards would tag whatever landed since — releasing a commit the
      # suite never saw, which is the precise failure this gate exists to stop.
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Validate the version
        env:
          # Never interpolate workflow inputs directly into a run block.
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.candidate_ref }}
        run: |
          set -uo pipefail
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must look like v1.2.3 (got '$VERSION')"; exit 1 ;;
          esac
          echo "candidate: $REF"
          echo "version:   $VERSION"

      - name: Require a prepared commit
        env:
          PREPARED: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          # `actions/checkout` treats an empty `ref` as "the default branch",
          # so a missing output would silently grade the PRE-bump tree and the
          # release would tag something the suite never saw. Refuse instead.
          if [ -z "$PREPARED" ]; then
            echo "::error::prepare produced no SHA — refusing to grade an unknown tree"
            exit 1
          fi
          echo "grading prepared commit $PREPARED"

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          # #549 — the PREPARED commit, not the input ref. The bump landed on
          # main a moment ago; grading the input ref would grade the tree from
          # before it.
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Pin the candidate to a SHA
        id: pin
        run: |
          set -uo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "graded commit: $SHA"

      - name: Refuse to re-cut an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists — pick a new version"
            exit 1
          fi
          echo "$VERSION is free"

      - name: Checkout fixtures
        uses: actions/checkout@v6
        with:
          repository: mergewatch/fixtures
          token: ${{ secrets.FIXTURES_TOKEN }}
          path: fixtures-repo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity for the fixture commits
        working-directory: fixtures-repo
        run: |
          git config user.name  "mergewatch-release-gate"
          git config user.email "release-gate@mergewatch.ai"

      - name: Resolve the selection
        id: select
        working-directory: fixtures-repo
        run: |
          set -uo pipefail
          # The FULL graded set — not the impact-selected subset the deploy gate
          # uses. A release is the one moment the whole contract matters.
          #
          # --graded is not optional: an ungraded fixture opens a PR, spends
          # real budget, and cannot fail. Counting those toward a release
          # headline is the coverage illusion (fixtures#1076 tracks grading them,
          # which raises this number honestly).
          rc=0
          scripts/select-fixtures.sh --tag correctness --automated --graded \
            > /tmp/sel.txt 2>/tmp/explain.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::fixture selection failed (rc=$rc)"; cat /tmp/explain.txt; exit 1
          fi
          COUNT=$(grep -c . /tmp/sel.txt || true)
          if [ "$COUNT" = "0" ]; then
            echo "::error::selection is empty — a release gate that runs nothing is not a gate"
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Selected $COUNT graded fixture(s)."; cat /tmp/sel.txt

      - name: Reset the fixtures environment
        working-directory: fixtures-repo
        run: scripts/reset-env.sh

      - name: Run the suite
        working-directory: fixtures-repo
        env:
          SLEEP: 45
        run: xargs scripts/run-suite.sh < /tmp/sel.txt

      - name: Restore the tooling checkout
        working-directory: fixtures-repo
        run: |
          # run-suite leaves the repo on the last fixture branch, and reset-env
          # moves local main to the e2e-baseline tag — which predates the
          # tooling and every expect.json. Without this restore the grader would
          # find no expectations, mark everything UNGRADED, and exit 0: a green
          # release gate that verified nothing.
          git fetch --quiet origin main
          git checkout -f --detach origin/main
          test -f scripts/grade-run.mjs     || { echo "::error::grade-run.mjs missing after restore"; exit 1; }
          test -f scripts/await-reviews.mjs || { echo "::error::await-reviews.mjs missing after restore"; exit 1; }
          n=$(ls fixtures/*/expect.json 2>/dev/null | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::no expect.json — every fixture would grade UNGRADED and pass"; exit 1; }
          echo "restored $n expect.json file(s)"

      - name: Wait for every review to complete
        working-directory: fixtures-repo
        run: scripts/await-reviews.mjs --stage "$MW_STAGE" --timeout 900

      - name: Grade
        id: grade
        working-directory: fixtures-repo
        run: |
          set -uo pipefail
          scripts/grade-run.mjs --stage "$MW_STAGE" | tee /tmp/grade.txt
          {
            echo 'summary<<EOF'
            grep -E 'passed ·|NOT VERIFIED' /tmp/grade.txt || true
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        working-directory: fixtures-repo
        run: |
          {
            echo "## Graded suite"
            echo
            echo '```'
            cat /tmp/grade.txt 2>/dev/null || echo "(grading did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        working-directory: fixtures-repo
        run: |
          # Before any human waits, not after. The manual fixtures are applied
          # by hand locally, so nothing needs to stay open — and leaving the
          # fixtures repo dirty is the fastest way to make the next run's
          # failures look like regressions.
          scripts/reset-env.sh || echo "::warning::teardown failed — check for stale fixture branches"

  verify:
    name: Manual verification
    needs: suite
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Required reviewers live on this environment. No concurrency group: this
    # job exists to wait for a person, and waiting while holding the fixtures
    # lock would block every merge's E2E gate.
    environment: release-approval
    steps:
      - name: Checkout the graded commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.suite.outputs.sha }}

      - name: Render the manual checklist
        env:
          VERSION: ${{ inputs.version }}
          GRADED: ${{ needs.suite.outputs.graded }}
        run: |
          {
            echo "# Release $VERSION — manual verification"
            echo
            echo "## Automated result"
            echo '```'
            echo "$GRADED"
            echo '```'
            echo
            echo "## What still needs a human"
            echo
            echo "These fixtures cannot run unattended. Apply each locally and check it"
            echo "against its card in \`e2e/RUNBOOK.md\`:"
            echo
            echo '```bash'
            echo "cd path/to/fixtures"
            echo "scripts/select-fixtures.sh --tag correctness --manual   # the list"
            echo "scripts/apply-fixture.sh <name>                          # opens its PR + prints the hint"
            echo '```'
            echo
            echo "Approving this job asserts that you did so. Rejecting cuts no tag."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Cut the release
    needs: [prepare, suite, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the graded commit
        uses: actions/checkout@v6
        with:
          # The pinned SHA, not the input ref — see suite.outputs.sha.
          ref: ${{ needs.suite.outputs.sha }}
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.candidate_ref }}
          SHA: ${{ needs.suite.outputs.sha }}
          ACTOR: ${{ github.actor }}
          GRADED: ${{ needs.suite.outputs.graded }}
        run: |
          set -uo pipefail
          # Belt and braces: the checkout above already pinned us to the graded
          # SHA, but tagging is irreversible, so verify rather than assume.
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$SHA" ]; then
            echo "::error::checked out $HEAD_SHA but the graded commit was $SHA — refusing to tag"
            exit 1
          fi
          git config user.name  "mergewatch-release-gate"
          git config user.email "release-gate@mergewatch.ai"

          # Build the notes BEFORE the tag is pushed.
          #
          # This used to run after, and v0.6.0 died here: the tag was already on
          # the remote when the step exited 1, leaving a tag with no release —
          # which the suite's "refuse to re-cut an existing tag" guard then
          # blocks from being retried. Everything that can fail belongs on the
          # near side of the irreversible push.
          #
          # Notes go in a file because embedding a fenced block inline would put
          # unindented lines inside this YAML scalar.
          #
          # The fence is sized to the content: the summary comes from
          # grade-run.mjs and would not normally contain backticks, but a fixture
          # name or reason that did would break out of a fixed ``` fence and
          # mangle every release note after it.
          #
          # `|| true` because `grep -o` exits 1 when it matches NOTHING, and a
          # backtick-free summary is the normal case — so under `bash -e` with
          # pipefail the guard aborted the release in every case except the rare
          # one it was written for. That is what took v0.6.0 down.
          longest=$(printf '%s' "$GRADED" | { grep -oE '`+' || true; } \
            | awk '{ if (length($0) > m) m = length($0) } END { print m+0 }')
          fence=$(printf '%*s' "$(( longest < 3 ? 3 : longest + 1 ))" '' | tr ' ' '`')
          # #550 — what CHANGED goes first. The provenance block below is the
          # evidence this gate exists to produce and is kept in full, but a
          # reader deciding whether to upgrade needs the changes, and the notes
          # used to omit them entirely: v0.6.1's said nothing about its eight
          # fixes, two of which had made features silently non-functional.
          #
          # Same generator as CHANGELOG.md. --no-heading because a GitHub
          # Release's title already IS the version.
          # `|| true` would conflate two different things: the generator
          # FAILING, and there being nothing to report. The generator already
          # emits an explicit "no feature or fix commits in this range" line
          # for the second, so an empty result here can only mean the first —
          # and silently printing a placeholder would ship notes that look
          # complete. Capture the status and fail the release instead.
          CHANGES=""
          gen_rc=0
          CHANGES="$(scripts/changelog-section.sh "$VERSION" --no-heading)" || gen_rc=$?
          if [ "$gen_rc" -ne 0 ] || [ -z "$CHANGES" ]; then
            echo "::error::changelog-section.sh failed (rc=$gen_rc) — refusing to publish notes that omit what changed"
            exit 1
          fi
          {
            printf '## What changed\n'
            printf '%s\n' "$CHANGES"
            printf '\n---\n\n'
            printf 'Released from `%s` (commit `%s`) via the release gate (#505).\n\n' "$REF" "$SHA"
            printf 'Graded fixture suite:\n\n'
            printf '%s\n%s\n%s\n\n' "$fence" "$GRADED" "$fence"
            printf 'Manual fixtures verified and approved by @%s.\n' "$ACTOR"
          } > /tmp/notes.md
          test -s /tmp/notes.md || { echo "::error::release notes came out empty — refusing to tag"; exit 1; }

          # Tag the SHA explicitly. `git tag <name>` with no commit-ish tags
          # HEAD, which is only correct as long as nothing moved it.
          git tag -a "$VERSION" -m "$VERSION" "$SHA"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$SHA" \
            --notes-file /tmp/notes.md

      - name: Publish the images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          # Publishing the release does NOT trigger docker-publish, however much
          # it looks like it should: GitHub suppresses workflow triggers for
          # events created with the default GITHUB_TOKEN, to stop workflows
          # recursing. v0.6.0 shipped a tag and a GitHub release with no images
          # because of exactly this, and nothing reported it (#513).
          #
          # An explicit dispatch is an API call, not an event, so the
          # suppression does not apply.
          gh workflow run docker-publish.yml --ref "$VERSION"

          # And then WAIT. Fire-and-forget would mean a release whose images
          # failed to build still reports success — the same shape of hole this
          # whole gate exists to close.
          echo "waiting for docker-publish on $VERSION"
          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 10
            RUN_ID="$(gh run list --workflow=docker-publish.yml --branch "$VERSION" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::docker-publish never started for $VERSION — the release exists without images"
            exit 1
          fi
          echo "docker-publish run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 20
          echo "images published for $VERSION"
