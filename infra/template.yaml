# =============================================================================
# MergeWatch AWS SAM Template
# =============================================================================
#
# This template defines the serverless infrastructure for MergeWatch, an
# open-source GitHub PR review tool powered by Amazon Bedrock.
#
# Architecture overview:
#   GitHub Webhook -> API Gateway -> WebhookHandler Lambda -> ReviewAgent Lambda
#                                                                  |
#                                                           Amazon Bedrock
#
# Data stores:
#   - mergewatch-installations: Tracks GitHub App installations and per-repo config
#   - mergewatch-reviews: Tracks PR review status and results
#
# Security model:
#   - NO hardcoded API keys — all AWS auth via IAM roles (instance profiles)
#   - GitHub credentials stored in SSM Parameter Store (encrypted)
#   - Lambda functions assume a shared role with least-privilege policies
#
# Deployment:
#   sam build && sam deploy --guided
#   Or use: ./scripts/deploy.sh
# =============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  MergeWatch — AI-powered GitHub PR review tool.
  Deploys Lambda functions, API Gateway, DynamoDB tables, and IAM roles.

# =============================================================================
# Template Parameters
# =============================================================================
# These allow customization at deploy time without modifying the template.

Parameters:
  # The deployment stage controls naming and can be used for environment-specific
  # configuration (e.g., different Bedrock models for dev vs prod).
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage (affects resource naming and configuration)

  # The default Bedrock model used for PR reviews. Can be overridden per-repo
  # via the modelId field in the mergewatch-installations table.
  DefaultBedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    # WARNING (#264): this Default binds only when the stack is FIRST created.
    # On an update, CloudFormation retains the stack's existing value for any
    # parameter the deploy does not pass — editing this line does nothing to a
    # live stack. The authoritative per-stage values live in infra/params/*.env
    # and are passed on every deploy; change the model there, not here.
    Description: >-
      Default Amazon Bedrock model ID for PR reviews. Authoritative values are
      in infra/params/{dev,prod}.env — this Default applies only at initial
      stack creation.

  # Deployment mode: 'saas' enables billing enforcement, 'self-hosted' disables it.
  DeploymentMode:
    Type: String
    Default: self-hosted
    AllowedValues:
      - self-hosted
      - saas
    Description: Deployment mode (saas enables billing, self-hosted disables it)

  # Base URL for the MergeWatch dashboard. Used to generate links in PR comments.
  DashboardBaseUrl:
    Type: String
    Default: https://mergewatch.ai
    Description: Base URL for the MergeWatch dashboard (no trailing slash)

# =============================================================================
# Global Configuration
# =============================================================================
# Settings applied to all Lambda functions unless overridden.

Globals:
  Function:
    # All functions run on Node.js 20.x (LTS)
    Runtime: nodejs20.x

    # ARM64 (Graviton2) provides better price-performance for Lambda
    Architectures:
      - arm64

    # Environment variables shared across all functions
    Environment:
      Variables:
        # The deployment stage — used for conditional logic in application code
        STAGE: !Ref Stage

        # Deployment mode — 'saas' enables billing enforcement
        DEPLOYMENT_MODE: !Ref DeploymentMode

        # DynamoDB table names — injected so Lambda code doesn't hardcode them
        INSTALLATIONS_TABLE: !Ref InstallationsTable
        REVIEWS_TABLE: !Ref ReviewsTable
        API_KEYS_TABLE: !Ref ApiKeysTable
        SESSIONS_TABLE: !Ref SessionsTable
        # FB-A / FB-E: shared across ReviewAgent (writes) and InsightsRollup (reads/writes).
        # Must be in Globals so ReviewAgent's best-effort writes don't silently fall back
        # to the unsuffixed default name and ResourceNotFoundException into a void.
        FINDING_DISPOSITIONS_TABLE: !Ref FindingDispositionsTable
        FP_INSIGHTS_TABLE: !Ref FpInsightsTable
        # TTM (#194): one row per PR. WebhookHandler writes lifecycle transitions
        # (opened/synchronize/closed); ReviewAgent marks reviewed/skipped; the
        # hourly InsightsRollup reads for cycle-time percentiles.
        PR_LIFECYCLE_TABLE: !Ref PRLifecycleTable
        # #195 Tier 2: helpful votes (ReviewAgent writes 👍/👎 deltas) + NPS
        # responses (dashboard writes). InsightsRollup reads both for the
        # engagement block's helpful-rate + NPS fields.
        SATISFACTION_TABLE: !Ref SatisfactionTable
        # #193: per-review cost rows. ReviewAgent writes one row per completed
        # review; InsightsRollup reads them for the engagement insight's cost block.
        REVIEW_COSTS_TABLE: !Ref ReviewCostsTable

        # SSM parameter paths for GitHub App credentials.
        # The Lambda functions read these at runtime via the AWS SDK.
        # This avoids storing secrets in environment variables or code.
        GITHUB_APP_ID_PARAM: !Sub '/mergewatch/${Stage}/github-app-id'
        GITHUB_PRIVATE_KEY_PARAM: !Sub '/mergewatch/${Stage}/github-private-key'
        GITHUB_WEBHOOK_SECRET_PARAM: !Sub '/mergewatch/${Stage}/github-webhook-secret'

        # Default Bedrock model — can be overridden per-repo in DynamoDB
        DEFAULT_BEDROCK_MODEL_ID: !Ref DefaultBedrockModelId

        # Dashboard base URL for review detail links in PR comments
        DASHBOARD_BASE_URL: !Ref DashboardBaseUrl

    # Tags applied to all functions for cost tracking and organization
    Tags:
      Project: MergeWatch
      Stage: !Ref Stage

Resources:
  # ===========================================================================
  # API Gateway — HTTP API
  # ===========================================================================
  # We use HTTP API (v2) instead of REST API (v1) because:
  # - Lower latency and cost
  # - Simpler configuration
  # - Automatic CORS support
  # - JWT authorizer support (if needed later)

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Description: MergeWatch webhook endpoint for GitHub events

      # CORS configuration — GitHub webhooks don't need CORS, but this is
      # useful if we add a dashboard frontend later.
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - Content-Type
          - X-GitHub-Event
          - X-GitHub-Delivery
          - X-Hub-Signature-256
          - Stripe-Signature

  # ===========================================================================
  # Lambda Function: WebhookHandler
  # ===========================================================================
  # Receives GitHub webhook events via API Gateway. Responsibilities:
  # 1. Verify the webhook signature (X-Hub-Signature-256)
  # 2. Parse the event payload
  # 3. Filter for relevant events (pull_request opened/synchronize)
  # 4. Write a "pending" record to the reviews table
  # 5. Invoke the ReviewAgent Lambda asynchronously
  #
  # This function is intentionally lightweight — it should respond to GitHub
  # within a few seconds to avoid webhook timeout/retry.

  WebhookHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mergewatch-webhook-${Stage}'
      Description: Receives and validates GitHub webhook events, dispatches review jobs

      # Path to the handler code (relative to the SAM build root)
      # Points to src/ (not package root) so SAM skips npm install —
      # workspace deps are resolved via pnpm symlinks during esbuild bundling.
      CodeUri: ../packages/lambda/src/
      Handler: handlers/webhook.handler

      # 512MB is sufficient for webhook validation and DynamoDB writes
      MemorySize: 512

      # 30 second timeout — webhook processing should be fast since the
      # actual review work is delegated to ReviewAgent
      Timeout: 30

      # Use the shared IAM role defined below
      Role: !GetAtt LambdaExecutionRole.Arn

      # API Gateway event source — maps POST /webhook to this function
      Events:
        WebhookPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST

      Environment:
        Variables:
          # The ReviewAgent function ARN — needed to invoke it asynchronously
          # (legacy fallback path when the queue URL is unset).
          REVIEW_AGENT_FUNCTION_NAME: !Ref ReviewAgent
          # #355 — review jobs go through SQS for admission control; the
          # webhook falls back to direct async invoke if this is unset
          # (deploy-order safety on stacks that predate the queue).
          REVIEW_QUEUE_URL: !Ref ReviewQueue

    # Build with esbuild for TypeScript support and tree-shaking
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/webhook.ts

  # ===========================================================================
  # Lambda Function: ReviewAgent
  # ===========================================================================
  # Performs the actual PR review using Amazon Bedrock. Responsibilities:
  # 1. Fetch PR diff from GitHub API
  # 2. Load repo-specific config from the installations table
  # 3. Send the diff to Amazon Bedrock for analysis
  # 4. Post review comments back to the PR via GitHub API
  # 5. Update the review record status in DynamoDB
  #
  # This function is invoked asynchronously by WebhookHandler, so it can
  # take up to 5 minutes without blocking the webhook response.

  ReviewAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mergewatch-review-agent-${Stage}'
      Description: AI-powered PR review agent using Amazon Bedrock

      CodeUri: ../packages/lambda/src/
      Handler: handlers/review-agent.handler

      # 1024MB — Bedrock responses can be large, and we may need to process
      # large diffs in memory
      MemorySize: 1024

      # 5 minute timeout — Bedrock inference can take 30-60s per call,
      # and we may make multiple calls for large PRs
      Timeout: 300

      Role: !GetAtt LambdaExecutionRole.Arn

      # #355 — reviews arrive via SQS with a hard concurrency cap. Lambda
      # concurrency is elastic but the Bedrock on-demand quota is not: a
      # 57-PR burst used to fan out into ~57 concurrent reviews, exhaust the
      # model quota, and terminally fail 32 of them. The queue turns bursts
      # into a paced backlog; MaximumConcurrency bounds the sustained request
      # rate Bedrock sees. BatchSize 1 keeps one review per invocation so a
      # throttle-rethrow returns exactly that review to the queue (redrive
      # x3 → DLQ — bounded, visible, never silent).
      Events:
        ReviewJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt ReviewQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 8

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/review-agent.ts

  # ===========================================================================
  # SQS: Review job queue (#355)
  # ===========================================================================
  # Admission control between WebhookHandler and ReviewAgent. Visibility
  # timeout must exceed the ReviewAgent Timeout (Lambda/SQS requirement, and
  # it doubles as the retry delay when a throttled review is rethrown).

  ReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'mergewatch-review-queue-${Stage}'
      VisibilityTimeout: 360
      # A review job older than a day is stale — the PR has moved on.
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReviewDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

  ReviewDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'mergewatch-review-dlq-${Stage}'
      # 14 days — long enough for an operator to notice and redrive.
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

  # ===========================================================================
  # Lambda Function: BillingHandler
  # ===========================================================================
  # Handles billing operations: card setup, top-ups, Stripe webhooks, and
  # billing status queries. Separate from WebhookHandler/ReviewAgent because
  # it has different IAM needs (Stripe SSM params) and a different timeout.

  BillingHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mergewatch-billing-${Stage}'
      Description: Billing operations — card setup, top-ups, Stripe webhooks, status

      CodeUri: ../packages/lambda/src/
      Handler: handlers/billing.handler

      MemorySize: 512
      Timeout: 30

      Role: !GetAtt LambdaExecutionRole.Arn

      Environment:
        Variables:
          STAGE: !Ref Stage

      Events:
        BillingPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /billing/{proxy+}
            Method: POST
        BillingGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /billing/{proxy+}
            Method: GET

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/billing.ts

  # ===========================================================================
  # Lambda Function: McpServer (MCP over Function URL)
  # ===========================================================================
  # Exposes the MergeWatch MCP server to external coding agents (Claude Code,
  # Cursor, etc.) over HTTP via a Lambda Function URL. Auth is Bearer-based at
  # the application layer (API key in Authorization header) — the Function URL
  # itself is public (AuthType: NONE) so non-AWS clients can reach it.
  #
  # Wire protocol: JSON-RPC 2.0 (single + batch). Tools: review_diff,
  # get_review_status. Resource: mergewatch://conventions/{owner}/{repo}.

  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mergewatch-mcp-${Stage}'
      Description: MCP server over HTTP — tool + resource endpoints for coding agents

      CodeUri: ../packages/lambda/src/
      Handler: handlers/mcp.handler

      # 1024MB matches ReviewAgent — review_diff runs the same pipeline and
      # keeps the full diff in memory.
      MemorySize: 1024

      # 5 min timeout — review_diff can take tens of seconds on a large PR
      # and we'd rather not cut off clients mid-review.
      Timeout: 300

      Role: !GetAtt LambdaExecutionRole.Arn

      # Public Function URL — AuthType: NONE because clients are coding
      # agents (not AWS callers). Application-layer Bearer auth is enforced
      # inside the handler via @mergewatch/mcp's resolveApiKey.
      #
      # CORS is wide open (AllowOrigins: '*') because MCP clients run in
      # diverse environments (Claude Code, Cursor, other agents) with no
      # fixed allowlist of origins. Auth is the security boundary here,
      # not CORS — a wildcard origin does not weaken Bearer-token auth.
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - '*'
          AllowHeaders:
            - content-type
            - authorization

      Environment:
        Variables:
          STAGE: !Ref Stage
          INSTALLATIONS_TABLE: !Ref InstallationsTable
          REVIEWS_TABLE: !Ref ReviewsTable
          API_KEYS_TABLE: !Ref ApiKeysTable
          SESSIONS_TABLE: !Ref SessionsTable
          DEFAULT_BEDROCK_MODEL_ID: !Ref DefaultBedrockModelId
          DASHBOARD_BASE_URL: !Ref DashboardBaseUrl
          DEPLOYMENT_MODE: !Ref DeploymentMode

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/mcp.ts

  # ===========================================================================
  # Lambda: Insights Rollup (FB-E)
  # ===========================================================================
  # Scheduled hourly to aggregate FindingDispositionRecord rows into
  # InstallationFPInsight rollups (7d / 30d / 90d windows per installation).
  # Powers the dashboard analytics + accuracy charts.
  #
  # Cron: top of every hour (`cron(0 * * * ? *)`). Hourly keeps the
  # dashboard's cost / cycle-time / engagement blocks within ~1h of fresh,
  # rather than up to 24h stale. Idempotent — re-running the same
  # window-end overwrites with identical numbers, so the higher cadence is
  # safe. (At scale, revisit incremental/active-only rollup — see #218.)

  InsightsRollupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mergewatch-insights-rollup-${Stage}'
      Description: Hourly FP insight rollup (FB-E) — aggregates disposition records into per-installation rolling-window insights

      CodeUri: ../packages/lambda/src/
      Handler: handlers/insights-rollup.handler

      # Light workload — Scan + filter + aggregate. 512MB is plenty;
      # bumping memory mainly for CPU headroom on the clustering step.
      MemorySize: 512

      # Bounded by the largest installation's record count (low-thousands
      # at scale). 5 min ceiling matches the SAM template's Globals.
      Timeout: 300

      Role: !GetAtt LambdaExecutionRole.Arn

      # No Environment block — inherits STAGE / INSTALLATIONS_TABLE /
      # FINDING_DISPOSITIONS_TABLE / FP_INSIGHTS_TABLE from Globals.

      # EventBridge schedule trigger — top of every hour.
      Events:
        HourlyRollup:
          Type: Schedule
          Properties:
            Schedule: cron(0 * * * ? *)
            Description: Hourly insight rollup (top of every hour, UTC)

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/insights-rollup.ts

  # ===========================================================================
  # Lambda: Review DLQ auto-redrive (#398)
  # ===========================================================================
  # The review queue retries a throttled job 3 times ~6 minutes apart — about
  # 18 minutes of cover, sized for burst contention. A provider quota window
  # is a different animal: on 2026-08-19 Bedrock rejected requests for ~2.75
  # hours and 28 of 57 reviews exhausted all attempts in the first minute,
  # landing in the DLQ where only a manual operator redrive could rescue them.
  # Their check runs sat `in_progress` indefinitely.
  #
  # This sweeper returns DLQ messages to the review queue on a schedule, so an
  # outage of any length self-heals. Redrives carry a generation counter with
  # a growing delay, and are abandoned (with an honest failing check run)
  # once the cap is hit.

  DlqRedriveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mergewatch-dlq-redrive-${Stage}'
      Description: Returns dead-lettered review jobs to the review queue so provider outages self-heal (#398)

      CodeUri: ../packages/lambda/src/
      Handler: handlers/dlq-redrive.handler

      # Trivial workload — SQS receive/send/delete plus an occasional check-run
      # write on abandonment.
      MemorySize: 256

      # Bounded by MAX_MESSAGES_PER_RUN (50) × a few SQS round trips.
      Timeout: 120

      Role: !GetAtt LambdaExecutionRole.Arn

      Environment:
        Variables:
          REVIEW_QUEUE_URL: !Ref ReviewQueue
          REVIEW_DLQ_URL: !Ref ReviewDLQ

      # Every 5 minutes. The DLQ only fills after a job's 3 attempts are
      # exhausted, so this is responsive without being chatty.
      Events:
        RedriveSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Sweep the review DLQ back onto the review queue (#398)

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/dlq-redrive.ts

  # ===========================================================================
  # DynamoDB Table: Installations
  # ===========================================================================
  # Tracks GitHub App installations and per-repo configuration.
  #
  # Schema:
  #   PK: installationId (String) — GitHub App installation ID
  #   SK: repoFullName (String)   — e.g., "octocat/Hello-World"
  #
  # Additional attributes (not defined here — DynamoDB is schemaless):
  #   - installedAt (String)  — ISO 8601 timestamp of installation
  #   - config (Map)          — Parsed .mergewatch.yml contents
  #   - modelId (String)      — Bedrock model ID override for this repo
  #
  # Access patterns:
  #   - Get config for a specific repo:    PK=installationId, SK=repoFullName
  #   - List all repos for installation:   PK=installationId (query)

  InstallationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-installations-${Stage}'

      # On-demand billing — no capacity planning needed.
      # For high-traffic deployments, consider switching to provisioned
      # capacity with auto-scaling.
      BillingMode: PAY_PER_REQUEST

      # Key schema: composite primary key (PK + SK)
      KeySchema:
        - AttributeName: installationId
          KeyType: HASH    # Partition key
        - AttributeName: repoFullName
          KeyType: RANGE   # Sort key

      # Only key attributes need to be defined in AttributeDefinitions.
      # Non-key attributes are added dynamically by the application.
      AttributeDefinitions:
        - AttributeName: installationId
          AttributeType: S  # String
        - AttributeName: repoFullName
          AttributeType: S  # String

      # Enable point-in-time recovery for data protection
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      # Server-side encryption using AWS-managed keys (no additional cost)
      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    # Retain the table even if the CloudFormation stack is deleted.
    # This prevents accidental data loss during stack updates or teardown.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ===========================================================================
  # DynamoDB Table: Reviews
  # ===========================================================================
  # Tracks PR review jobs and their status.
  #
  # Schema:
  #   PK: repoFullName (String)        — e.g., "octocat/Hello-World"
  #   SK: prNumberCommitSha (String)   — e.g., "42#abc123"
  #
  # Additional attributes:
  #   - status (String)      — pending | in_progress | complete | failed
  #   - commentId (Number)   — GitHub comment ID (for editing in-place)
  #   - createdAt (String)   — ISO 8601 timestamp
  #   - completedAt (String) — ISO 8601 timestamp
  #
  # Access patterns:
  #   - Get review for specific PR+commit: PK=repoFullName, SK=prNumber#sha
  #   - List all reviews for a repo:       PK=repoFullName (query)
  #   - List reviews for a PR:             PK=repoFullName, SK begins_with("42#")

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-reviews-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: repoFullName
          KeyType: HASH
        - AttributeName: prNumberCommitSha
          KeyType: RANGE

      AttributeDefinitions:
        - AttributeName: repoFullName
          AttributeType: S
        - AttributeName: prNumberCommitSha
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S

      # #335 — time-ordered per-repo review listing. The base sort key
      # (prNumberCommitSha) orders by PR-number STRING, so "newest N" walks
      # lexicographic PR numbers ("9#…" > "42#…" > "100#…"), not time. The
      # dashboard's listReviews queries this index descending on createdAt,
      # and puts date-range bounds in the key condition so `Limit` applies
      # to matching items (the base-table path filtered AFTER the read).
      # Every review row carries createdAt (required on ReviewItem), so the
      # index covers the full table. IAM index access is already granted
      # (`${ReviewsTable.Arn}/index/*` below; Amplify policy covers
      # `table/mergewatch-*/index/*`).
      GlobalSecondaryIndexes:
        - IndexName: ByRepoCreatedAt
          KeySchema:
            - AttributeName: repoFullName
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true

      # Time-to-live: automatically delete old review records after a
      # configurable period. The application sets the `ttl` attribute
      # on each item. Uncomment and set the attribute name to enable.
      # TimeToLiveSpecification:
      #   AttributeName: ttl
      #   Enabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ===========================================================================
  # DynamoDB Table: ApiKeys
  # ===========================================================================
  # Stores hashed API keys that unlock MCP server access for a GitHub App
  # installation. The raw key is never stored — only its sha256 hex digest.
  #
  # Schema:
  #   PK: keyHash (String)           — sha256 hex of the raw key
  #   GSI "ByInstallation":
  #     PK: installationId (String)  — list keys for a given installation
  #
  # Additional attributes (schemaless):
  #   - label (String)               — human-friendly label
  #   - scope ('all' | String[])     — repos this key unlocks
  #   - createdBy (String)           — GitHub user ID that minted the key
  #   - createdAt (String)           — ISO 8601
  #   - lastUsedAt (String)          — ISO 8601, updated on each MCP request

  ApiKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-api-keys-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: keyHash
          KeyType: HASH

      AttributeDefinitions:
        - AttributeName: keyHash
          AttributeType: S
        - AttributeName: installationId
          AttributeType: S

      GlobalSecondaryIndexes:
        - IndexName: ByInstallation
          KeySchema:
            - AttributeName: installationId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ===========================================================================
  # DynamoDB Table: Sessions
  # ===========================================================================
  # Ephemeral dedupe store for MCP review_diff billing. A session collapses
  # repeated calls from an agent into a single 30-minute billing window.
  #
  # Schema:
  #   PK: sessionId (String)
  #
  # Additional attributes:
  #   - installationId (String)
  #   - firstBilledAt (String)   — ISO 8601
  #   - maxBilledCents (Number)  — highest cost billed so far
  #   - iteration (Number)       — review_diff call count
  #   - ttl (Number)             — Unix epoch seconds; auto-expired by DDB
  #
  # Diverges from other tables: DeletionPolicy=Delete because sessions are
  # ephemeral by design and have no historical value.

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-sessions-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH

      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S

      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  # ===========================================================================
  # DynamoDB: FindingDispositions (FB-A)
  # ===========================================================================
  # Per-finding cross-PR identity records — one row per distinct
  # findingMatchKey per repo per installation. Drives the FB-E hourly
  # rollup and (via the rollup) every dashboard insight chart.
  #
  # Schema:
  #   PK: pk  (String)  — "${installationId}#${repoFullName}"
  #   SK: sk  (String)  — findingMatchKey (file::T::title or file::F::fp)
  #
  # Attributes (best-effort, monotonic counters):
  #   - firstSeen / lastSeen   (String, ISO 8601)
  #   - surfaceCount / disputeCount / verifiedCount / unverifiedCount /
  #     silentDropCount / agreementCount  (Number)
  #   - category / topAgent    (String)
  #   - sigTokens              (List<String>) — W10 cluster bag
  #   - rejectReasons          (List<Map>)    — FB-D append-only log
  #
  # Reads are bounded (FB-E hourly, listByInstallation with Scan + filter);
  # writes are hot-path (every surfacing/dispute/verification). PAY_PER_REQUEST
  # keeps it cheap.

  FindingDispositionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-finding-dispositions-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ===========================================================================
  # DynamoDB: InstallationFPInsights (FB-E)
  # ===========================================================================
  # Per-installation rolling-window FP insight rollups. Three rows per
  # installation (7d / 30d / 90d), replaced idempotently by the hourly
  # InsightsRollupFunction. Reads power the dashboard FB-F..FB-J charts.
  #
  # Schema:
  #   PK: installationId (String)
  #   SK: window         (String — '7d' | '30d' | '90d')
  #
  # Attributes (set on every hourly run):
  #   - windowStart / windowEnd / generatedAt (String, ISO 8601)
  #   - totalFindingsSurfaced / totalDisputes / totalSilentDrops /
  #     totalAgreements (Number)
  #   - disputeRate (String — same precision discipline as estimated_cost_usd)
  #   - perCategory / perRepo / topClusters (Map / List)
  #
  # Idempotent writes via PutCommand → no ConditionExpression needed.

  FpInsightsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-installation-fp-insights-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: installationId
          KeyType: HASH
        - AttributeName: window
          KeyType: RANGE

      AttributeDefinitions:
        - AttributeName: installationId
          AttributeType: S
        - AttributeName: window
          AttributeType: S

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ===========================================================================
  # DynamoDB: PRLifecycle (TTM / #194)
  # ===========================================================================
  # One row per pull request MergeWatch saw — independent of the per-commit
  # Reviews table. Drives the hourly cycle-time rollup (time-to-merge,
  # time-from-first-review-to-merge, round-trips).
  #
  # Schema:
  #   PK: pk  (String)  — "${installationId}#${repoFullName}"
  #   SK: sk  (String)  — prNumber (stringified)
  #
  # Attributes (best-effort writes from webhook + review pipeline):
  #   - prCreatedAt / firstReviewAt / mergedAt / closedAt / updatedAt (String, ISO 8601)
  #   - state (String — open | merged | closed_unmerged)
  #   - reviewed / skipped (Bool)
  #   - totalPushes / pushesAfterFirstReview (Number)
  #   - ttl (Number) — epoch seconds, ~90d past the terminal event
  #
  # TimeToLiveSpecification reaps terminal rows after the 90d window passes.

  PRLifecycleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-pr-lifecycle-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # #195 Tier 2 — explicit-satisfaction signals. Partitioned by installation;
  # SK distinguishes helpful-vote rows (HV#repo#pr) from NPS rows (NPS#userId).
  # ReviewAgent writes helpful-vote deltas; the dashboard writes NPS responses;
  # the hourly InsightsRollup reads both for the engagement block.
  # Adversarial Defense waitlist signups (#315 market test). Partitioned on the
  # lowercased email so a repeat submission is an idempotent overwrite rather
  # than a duplicate lead — and so the API can tell a new signup from a repeat
  # and only alert on the former.
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-waitlist-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: email
          KeyType: HASH

      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S

      SSESpecification:
        SSEEnabled: true

      # No TTL: a lead should not silently expire.

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Environment
          Value: !Ref Stage

  SatisfactionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-satisfaction-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # #193 — per-review LLM cost rows. Partitioned by installation (PK), SK
  # `repo#pr#commit`; ReviewAgent writes one row per completed review and the
  # hourly InsightsRollup reads them for the engagement insight's cost block.
  # TTL (~90d past completion) self-prunes rows past the longest window.
  ReviewCostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergewatch-review-costs-${Stage}'
      BillingMode: PAY_PER_REQUEST

      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S

      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MergeWatch
        - Key: Stage
          Value: !Ref Stage

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ===========================================================================
  # IAM Role: Lambda Execution Role
  # ===========================================================================
  # A single shared role for both Lambda functions. This simplifies management
  # and keeps the template DRY. If you need per-function permissions later,
  # split this into separate roles.
  #
  # Permissions:
  #   1. CloudWatch Logs — write log groups/streams/events
  #   2. DynamoDB — read/write on both tables
  #   3. Amazon Bedrock — full access to invoke models
  #   4. SSM Parameter Store — read GitHub credentials
  #   5. Lambda Invoke — WebhookHandler needs to invoke ReviewAgent

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'mergewatch-lambda-role-${Stage}'
      Description: Execution role for MergeWatch Lambda functions

      # Trust policy: allow Lambda service to assume this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      # Managed policies: AWS-provided policy bundles
      ManagedPolicyArns:
        # Full access to Amazon Bedrock — needed to invoke foundation models
        # for PR review. If you want tighter controls, replace this with a
        # custom policy that only allows bedrock:InvokeModel on specific models.
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

      # Inline policies: custom permissions specific to MergeWatch
      Policies:
        # --- CloudWatch Logs ---
        # Lambda needs to create log groups and write log events
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/mergewatch-*'

        # --- DynamoDB Access ---
        # Read/write access scoped to the two MergeWatch tables only.
        # Uses specific actions instead of dynamodb:* for least privilege.
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  # Table ARNs
                  - !GetAtt InstallationsTable.Arn
                  - !GetAtt ReviewsTable.Arn
                  - !GetAtt ApiKeysTable.Arn
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt FindingDispositionsTable.Arn
                  - !GetAtt FpInsightsTable.Arn
                  - !GetAtt PRLifecycleTable.Arn
                  - !GetAtt SatisfactionTable.Arn
                  - !GetAtt ReviewCostsTable.Arn
                  # Index ARNs (for future GSIs)
                  - !Sub '${InstallationsTable.Arn}/index/*'
                  - !Sub '${ReviewsTable.Arn}/index/*'
                  - !Sub '${ApiKeysTable.Arn}/index/*'
                  - !Sub '${SessionsTable.Arn}/index/*'
                  - !Sub '${FindingDispositionsTable.Arn}/index/*'
                  - !Sub '${FpInsightsTable.Arn}/index/*'
                  - !Sub '${PRLifecycleTable.Arn}/index/*'
                  - !Sub '${SatisfactionTable.Arn}/index/*'
                  - !Sub '${ReviewCostsTable.Arn}/index/*'

        # --- SSM Parameter Store ---
        # Read-only access to GitHub credentials stored in SSM.
        # Scoped to the /mergewatch/ parameter path.
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mergewatch/${Stage}/*'

        # --- Lambda Invoke ---
        # WebhookHandler needs to invoke ReviewAgent asynchronously.
        # Scoped to the specific ReviewAgent function ARN.
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:mergewatch-review-agent-${Stage}'
              # #355 — the webhook sends review jobs to the queue; the
              # ReviewAgent's SQS event source polls it (custom-role
              # functions don't get these attached automatically by SAM).
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReviewQueue.Arn
              # #398 — the DLQ sweeper reads and deletes dead-lettered jobs
              # before re-sending them to ReviewQueue (SendMessage above).
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReviewDLQ.Arn

  # ===========================================================================
  # AWS Amplify Hosting — Next.js Dashboard
  # ===========================================================================
  # The web dashboard is managed via the Amplify Console (not CloudFormation).
  # Amplify's WEB_COMPUTE platform requires console-level role configuration
  # that CloudFormation does not fully support.
  #
  # To set up the dashboard:
  #   1. Create an Amplify app in the AWS Console
  #   2. Connect the GitHub repo, set app root to "web"
  #   3. Set environment variables:
  #        NEXTAUTH_URL, NEXTAUTH_SECRET, GITHUB_CLIENT_ID,
  #        GITHUB_CLIENT_SECRET, DYNAMODB_TABLE_INSTALLATIONS,
  #        DYNAMODB_TABLE_REVIEWS, GITHUB_APP_SLUG
  #   4. Add a DynamoDB inline policy to the Amplify SSR role:
  #      The Amplify-created role (AmplifySSRLoggingRole-*) needs an inline
  #      policy named "MergeWatchDynamoDBAccess" granting dynamodb:GetItem,
  #      PutItem, UpdateItem, DeleteItem, Query, Scan, BatchGetItem, and
  #      BatchWriteItem on arn:aws:dynamodb:<region>:<account>:table/mergewatch-*
  #      and .../index/*. Without this, the dashboard API routes will get
  #      AccessDeniedException when querying DynamoDB.
  # ===========================================================================

# =============================================================================
# Stack Outputs
# =============================================================================
# These values are displayed after deployment and can be referenced by other
# stacks or scripts.

Outputs:
  # The webhook URL to configure in the GitHub App settings
  WebhookUrl:
    Description: GitHub webhook URL — add this to your GitHub App configuration
    Value: !Sub 'https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/webhook'

  # Function ARNs for reference and monitoring
  WebhookHandlerArn:
    Description: ARN of the WebhookHandler Lambda function
    Value: !GetAtt WebhookHandler.Arn

  ReviewAgentArn:
    Description: ARN of the ReviewAgent Lambda function
    Value: !GetAtt ReviewAgent.Arn

  BillingHandlerArn:
    Description: ARN of the BillingHandler Lambda function
    Value: !GetAtt BillingHandler.Arn

  BillingUrl:
    Description: Billing API base URL
    Value: !Sub 'https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/billing'

  McpFunctionArn:
    Description: ARN of the MCP server Lambda function
    Value: !GetAtt McpFunction.Arn

  McpFunctionUrl:
    Description: MCP server Function URL for coding agents (Bearer auth)
    Value: !GetAtt McpFunctionUrl.FunctionUrl

  # Table names for use in scripts or other tooling
  InstallationsTableName:
    Description: Name of the DynamoDB installations table
    Value: !Ref InstallationsTable

  ReviewsTableName:
    Description: Name of the DynamoDB reviews table
    Value: !Ref ReviewsTable

  FindingDispositionsTableName:
    Description: Name of the DynamoDB finding-dispositions table (FB-A)
    Value: !Ref FindingDispositionsTable

  FpInsightsTableName:
    Description: Name of the DynamoDB installation-fp-insights table (FB-E)
    Value: !Ref FpInsightsTable

  PRLifecycleTableName:
    Description: Name of the DynamoDB pr-lifecycle table (TTM / #194)
    Value: !Ref PRLifecycleTable

  # The IAM role ARN — useful for debugging permission issues
  LambdaRoleArn:
    Description: ARN of the shared Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn

